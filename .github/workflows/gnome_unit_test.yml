name: gnome_unit_test

on:
  push:
    branches: [ main, develop, 'release/**', 'hotfix/**', 'feature/**'] 
  pull_request:
    branches: [ main, develop, 'release/**', 'hotfix/**', 'feature/**'] 

env:
  THUNDER_REF: "R4.4.3"

jobs:
  unit-tests:
    name: Build and run unit tests
    runs-on: ubuntu-22.04
        
    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo apt-get install -y pkg-config libglib2.0-dev libnm-dev libcurl4-openssl-dev lcov ninja-build

      - name: Configure Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: Configure CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.16.x'

      - name: Checkout thunder repositories
        run: |
          git clone https://github.com/rdkcentral/ThunderTools ThunderTools --branch ${{ env.THUNDER_REF }}
          git clone https://github.com/rdkcentral/Thunder Thunder --branch ${{ env.THUNDER_REF }}

      - name: Build ThunderTools
        run: >
          cmake
          -S "${{github.workspace}}/ThunderTools" -B build/ThunderTools
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          &&
          cmake --build build/ThunderTools --target install -j8

      - name: Checkout networkmanager
        uses: actions/checkout@v3
        with:
          path: networkmanager
      - name: Apply Thunder Patches
        run: |
          cd ${{github.workspace}}/Thunder
          git apply ${{github.workspace}}/networkmanager/tests/patches/thunder/Remove-SmartLinkType.patch

      - name: Build Thunder
        run: >
          cmake
          -S "${{github.workspace}}/Thunder" -B build/Thunder
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBINDING=127.0.0.1
          -DPORT=9998
          &&
          cmake --build build/Thunder --target install -j8

      - name: Build networkmanager with Gnome GDBUS Proxy
        run: >
          cmake
          -S "${{github.workspace}}/networkmanager"
          -B build/GnomeGdbusNetworkmanager
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          -DENABLE_GNOME_NETWORKMANAGER=ON
          -DENABLE_GNOME_GDBUS=ON
          -DENABLE_PLUGIN_CLI=ON
          &&
          cmake --build build/GnomeGdbusNetworkmanager --target install -j8

      - name: Build networkmanager with Gnome libnm Proxy
        run: >
          cmake
          -S "${{github.workspace}}/networkmanager"
          -B build/GnomeLibnmNetworkmanager
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="${{github.workspace}}/install/usr"
          -DCMAKE_MODULE_PATH="${{github.workspace}}/install/tools/cmake"
          -DCODE_COVERAGE=ON
          -DENABLE_GNOME_NETWORKMANAGER=ON
          -DENABLE_PLUGIN_CLI=ON
          &&
          cmake --build build/GnomeLibnmNetworkmanager --target install -j8

      - name: Run unit tests with thunder
        run: |
          export LD_LIBRARY_PATH=${PWD}/install/usr/lib:${LD_LIBRARY_PATH}
          export PATH=${PWD}/install/usr/bin:${PATH}
          echo "Starting WPEFramework..."

          # Run WPEFramework in background in a new process group
          setsid WPEFramework -f -c ${PWD}/install/etc/WPEFramework/config.json &
          PID=$!
          echo "WPEFramework PID: $PID"
          sleep 5 # Wait for WPEFramework to start
          echo "Running unit tests..."
          # Run the functional l3 tests
          functional_l3_tests 

          # Kill the whole process group (includes child processes)
          kill -TERM -$(ps -o pgid= $PID | grep -o '[0-9]*') || true

      - name: Generate gnome coverage
        run: |
            lcov -c -o gnome_proxy_coverage.info -d build/GnomeLibnmNetworkmanager
            lcov -r gnome_proxy_coverage.info '/usr/include/*' '*/build/GnomeLibnmNetworkmanager/*' \
                                  '*/install/usr/include/*' '*/tests/*' 'googlemock/*' 'googletest/*' \
                                  -o filtered_gnome_proxy_coverage.info
      - name: Generate the html report
        run: |
            genhtml filtered_gnome_proxy_coverage.info --output-directory /tmp/gnome_coverage_report

      - name: Upload the coverage report to Pull request using actions
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: /tmp/gnome_coverage_report

